services:
  mariadb:
    image: mariadb:10.11
    container_name: ompdf_mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=root_password
      - MARIADB_USER=moodleuser
      - MARIADB_PASSWORD=moodlepass
      - MARIADB_DATABASE=moodle
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "3307:3306" # Mapped to host 3307 to avoid conflict with DBngin / MySQL on port 3306

  web:
    build: .
    container_name: ompdf_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/mod/ompdf
    depends_on:
      - mariadb

volumes:
  mariadb_data:
